services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sprintsense
      POSTGRES_USER: sprintsense
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://sprintsense:${DB_PASSWORD:-devpassword123}@db:5432/sprintsense
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PAGERDUTY_API_TOKEN: ${PAGERDUTY_API_TOKEN}
      OMLX_URL: http://host.docker.internal:8000
      OMLX_API_KEY: omlx-test
      OMLX_MODEL: Llama-3.2-3B-Instruct-4bit
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:5000
    depends_on:
      - api

volumes:
  pgdata:
